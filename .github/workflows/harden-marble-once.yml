name: Harden Marble Race Once
on:
  push:
    paths:
      - '.github/workflows/harden-marble-once.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CSP guard and rebuild single-file bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          p=Path('index.html')
          s=p.read_text('utf-8')
          m=re.search(r"const s=\[(.*?)\]\.join\(''\);",s,re.S)
          if not m:
              raise SystemExit('compressed payload not found')
          payload=''.join(re.findall(r"'([^']*)'",m.group(1)))
          src=gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          src=re.sub(r'<script[^>]+src=["\'](?:https?:)?//lc\.getunicorn\.org[^>]*></script>\s*','',src,flags=re.I)
          csp='''<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';">'''
          if 'Content-Security-Policy' not in src:
              vp='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />'
              src=src.replace(vp,vp+'\n'+csp,1)
          b64=base64.b64encode(gzip.compress(src.encode('utf-8'),compresslevel=9,mtime=0)).decode()
          parts=[b64[i:i+8000] for i in range(0,len(b64),8000)]
          wrapper='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+csp+'<title>구슬레이스</title></head><body><script>(async()=>{const s=[\n'+',\n'.join(repr(x) for x in parts)+"\n].join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream(\"gzip\");const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()})().catch(e=>{document.body.innerHTML='<pre style=\"color:white;background:#111;padding:20px\">'+e+'</pre>'});</script></body></html>"
          p.write_text(wrapper,'utf-8')
          PY
      - name: Commit hardened index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Harden V11.3 against external scripts"
            git push
          fi