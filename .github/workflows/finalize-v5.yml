name: Finalize V5
on:
  push:
    paths:
      - '.github/workflows/finalize-v5.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean and finalize
        shell: bash
        run: |
          sed -i '/lc\.getunicorn\.org/d' index.html
          rm -rf v5_parts
          rm -f .github/workflows/finalize-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize MARBLE DASH V5 PREMIUM"
          git push
