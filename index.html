<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MARBLE DASH · 구슬 레이스</title>
<style>
  :root{
    --bg:#111525;--panel:rgba(18,23,42,.86);--line:rgba(255,255,255,.13);--text:#f7f8ff;--muted:#aeb7d0;
    --accent:#8bf0dc;--accent2:#ffd269;--danger:#ff6f91;--shadow:0 20px 70px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1020;color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
  button,input,textarea,select{font:inherit}
  button{border:0;cursor:pointer;color:inherit}
  #app{position:relative;width:100%;height:100%;overflow:hidden}
  canvas{display:block;width:100%;height:100%;background:#10162a}

  .glass{background:linear-gradient(180deg,rgba(24,30,55,.92),rgba(13,17,34,.90));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  #setup{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:26px;background:
    radial-gradient(circle at 15% 15%,rgba(255,111,145,.18),transparent 34%),
    radial-gradient(circle at 80% 20%,rgba(139,240,220,.14),transparent 34%),
    linear-gradient(145deg,#171c36,#0b0f1e 62%)}
  .setup-card{width:min(1180px,96vw);height:min(820px,94vh);border-radius:32px;overflow:hidden;display:grid;grid-template-columns:390px 1fr}
  .setup-left{padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo-orbit{width:54px;height:54px;position:relative;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-shadow:inset 0 0 25px rgba(139,240,220,.08)}
  .logo-orbit:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;left:17px;top:17px;background:linear-gradient(145deg,#fff,#8bf0dc 48%,#4cb5ff);box-shadow:0 0 24px rgba(139,240,220,.75)}
  .logo-orbit:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;left:5px;top:8px;background:#ff7498;box-shadow:32px 27px 0 #ffd269}
  h1{font-size:29px;letter-spacing:-1.2px;margin:0;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:2px}
  .label{font-size:13px;color:#d8def2;font-weight:800;margin:14px 0 8px}
  textarea{width:100%;min-height:250px;resize:none;border-radius:18px;background:#0f1429;border:1px solid rgba(255,255,255,.1);color:white;padding:16px 17px;outline:none;line-height:1.65}
  textarea:focus{border-color:rgba(139,240,220,.6);box-shadow:0 0 0 4px rgba(139,240,220,.08)}
  .participant-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
  .settings-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .control{padding:11px 12px;border-radius:14px;background:#11172f;border:1px solid rgba(255,255,255,.08)}
  .control>span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.control select{width:100%;border:0;background:transparent;color:#fff;outline:none;font-weight:800}.control option{color:#111}
  .winner-control{padding-bottom:9px}.winner-stepper{display:grid;grid-template-columns:30px 1fr 30px;gap:6px;align-items:center}.winner-stepper button{height:30px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:1000;font-size:17px}.winner-stepper button:hover{background:rgba(255,255,255,.15)}.winner-stepper input{width:100%;height:30px;border:0;border-radius:8px;text-align:center;background:#0b1023;color:#fff;font-weight:1000;outline:none;-moz-appearance:textfield}.winner-stepper input::-webkit-outer-spin-button,.winner-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.winner-presets{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.winner-presets button{min-width:28px;height:24px;padding:0 7px;border-radius:8px;background:rgba(255,255,255,.06);color:#cfd7ef;font-size:10px;font-weight:900}.winner-presets button.active{background:#8bf0dc;color:#08201d}.winner-presets button:disabled{opacity:.25;cursor:not-allowed}
  .start-btn{margin-top:auto;height:62px;border-radius:18px;font-size:18px;font-weight:900;background:linear-gradient(135deg,#7be8d5,#6ac8ff 48%,#a77bff);box-shadow:0 14px 40px rgba(82,190,228,.23);color:#07131d;transition:.2s transform,.2s filter}.start-btn:hover{transform:translateY(-2px);filter:brightness(1.06)}

  .setup-right{padding:28px;min-width:0;overflow:auto}
  .section-title{font-weight:900;font-size:18px;margin-bottom:5px}.section-desc{font-size:13px;color:var(--muted);margin-bottom:17px}
  .maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .map-card{position:relative;height:180px;border-radius:22px;overflow:hidden;border:2px solid transparent;background:#171d35;padding:0;text-align:left;transition:.2s transform,.2s border-color,.2s box-shadow}
  .map-card:hover{transform:translateY(-2px)}.map-card.selected{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.07),0 14px 35px rgba(0,0,0,.25)}
  .map-art{position:absolute;inset:0;overflow:hidden}.map-art:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,8,20,.92),transparent 67%)}
  .map-copy{position:absolute;left:17px;right:17px;bottom:14px;z-index:2}.map-copy b{font-size:17px}.map-copy small{display:block;color:#d4dbef;margin-top:3px;font-size:11px}
  .tag{position:absolute;right:12px;top:11px;z-index:2;font-size:10px;font-weight:900;padding:6px 9px;border-radius:999px;background:rgba(8,10,24,.65);border:1px solid rgba(255,255,255,.14)}
  .art-candy{background:radial-gradient(circle at 28% 28%,#fff0 0 9%,#ff75b8 10% 13%,transparent 14%),radial-gradient(circle at 70% 50%,#ffce75 0 9%,transparent 10%),linear-gradient(140deg,#7d5cff,#ff7fb8 48%,#7df1dc)}
  .art-neon{background:linear-gradient(120deg,#050713,#15205a);}.art-neon:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(60,238,255,.5) 35px 37px),repeating-linear-gradient(0deg,transparent 0 34px,rgba(255,64,175,.34) 35px 37px);transform:perspective(220px) rotateX(64deg) translateY(20%)}
  .art-space{background:radial-gradient(circle at 78% 24%,#ffd7ff 0 4%,#7e55ff 5% 9%,transparent 10%),radial-gradient(circle at 20% 26%,#fff 0 1px,transparent 2px),radial-gradient(circle at 63% 55%,#fff 0 1px,transparent 2px),linear-gradient(145deg,#10062a,#071a36)}
  .art-jungle{background:linear-gradient(145deg,#0d362d,#124f39 48%,#6a5b25)}.art-jungle:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(65deg,transparent 0 35px,rgba(232,204,95,.12) 36px 43px)}
  .art-chaos{background:conic-gradient(from 80deg,#ff4a88,#7b61ff,#35e5d1,#ffd257,#ff4a88)}.art-chaos:before{content:"";position:absolute;inset:16%;border:12px dashed rgba(10,13,31,.55);border-radius:50%;transform:rotate(14deg)}

  #hud{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
  .topbar{position:absolute;left:18px;right:18px;top:16px;display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
  .race-title{padding:11px 16px;border-radius:16px;min-width:220px}.race-title b{display:block;font-size:15px}.race-title span{font-size:11px;color:var(--muted)}
  .rank-strip{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:55vw}
  .rank-chip{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(9,12,25,.78);border:1px solid rgba(255,255,255,.13);box-shadow:0 7px 18px rgba(0,0,0,.16)}
  .rank-dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .hud-btns{display:flex;gap:8px;pointer-events:auto}.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(9,12,25,.8);border:1px solid rgba(255,255,255,.13);font-size:18px}
  .side-card{position:absolute;right:18px;top:82px;width:164px;border-radius:18px;padding:12px}.side-card h3{font-size:12px;margin:0 0 8px;color:#cbd2e7}.leader-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:11px}.leader-name{max-width:105px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #minimap{width:100%;height:210px;border-radius:12px;background:rgba(2,5,14,.45);border:1px solid rgba(255,255,255,.08);margin-top:9px}
  .bottom-actions{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:9px;pointer-events:auto}.pill{padding:11px 16px;border-radius:999px;background:rgba(7,10,21,.82);border:1px solid rgba(255,255,255,.13);font-weight:900;font-size:12px}.pill.hot{background:linear-gradient(135deg,#ff6e93,#ffae63);color:#201015}

  #countdown{position:absolute;inset:0;z-index:40;display:none;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.02),rgba(0,0,0,.18))}
  #countdownText{font-size:min(22vw,220px);font-weight:1000;line-height:1;text-shadow:0 12px 45px rgba(0,0,0,.35);animation:pop .75s ease both}@keyframes pop{0%{transform:scale(.35);opacity:0}35%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:.98}}
  #eventBanner{position:absolute;z-index:45;left:50%;top:20%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;font-size:clamp(28px,5vw,70px);font-weight:1000;letter-spacing:-2px;text-align:center;text-shadow:0 8px 32px rgba(0,0,0,.55);transition:.22s}.show-banner{opacity:1!important;transform:translate(-50%,-50%) scale(1)!important}

  #results{position:absolute;inset:0;z-index:50;display:none;place-items:center;background:rgba(5,7,16,.66);backdrop-filter:blur(10px)}
  .result-card{width:min(760px,92vw);max-height:92vh;border-radius:30px;padding:28px;text-align:center;overflow:auto;position:relative}.result-card:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(139,240,220,.17),transparent 67%);left:-100px;top:-120px;pointer-events:none}
  .result-title{font-size:36px;font-weight:1000;letter-spacing:-1.8px;margin:0 0 6px}.result-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px auto 20px;min-height:210px}.pod{width:30%;max-width:185px;border-radius:22px 22px 12px 12px;padding:16px 10px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.pod.one{min-height:205px;background:linear-gradient(180deg,rgba(255,221,116,.25),rgba(255,255,255,.05));border-color:rgba(255,221,116,.5)}.pod.two{min-height:170px}.pod.three{min-height:145px}.medal{font-size:34px}.pod b{display:block;margin-top:8px;font-size:18px}.pod small{display:block;color:var(--muted);margin-top:3px}
  .extra-winners{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 18px}.extra-win{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:900}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.result-actions button{padding:13px 18px;border-radius:14px;background:#11182f;border:1px solid rgba(255,255,255,.1);font-weight:900}.result-actions .primary{background:linear-gradient(135deg,#7be8d5,#6ac8ff);color:#07131d}
  #cameraBadge{position:absolute;left:18px;bottom:18px;z-index:18;padding:9px 13px;border-radius:999px;background:rgba(8,11,24,.78);border:1px solid rgba(255,255,255,.13);font-size:11px;font-weight:1000;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  @media(max-width:900px){.setup-card{grid-template-columns:1fr;height:95vh}.setup-left{border-right:0;border-bottom:1px solid var(--line);padding:18px}.setup-right{padding:18px}.maps{grid-template-columns:1fr 1fr}.map-card{height:145px}.setup-left textarea{min-height:140px}.side-card{display:none}.rank-strip{max-width:62vw}.race-title{min-width:170px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="setup">
    <div class="setup-card glass">
      <div class="setup-left">
        <div class="brand"><div class="logo-orbit"></div><div><h1>MARBLE DASH</h1><div class="sub">광고 없이 즐기는 구슬 레이스</div></div></div>
        <div class="label">참가자</div>
        <textarea id="names">민준\n서연\n지우\n하준\n서윤\n도윤\n지민\n예준\n수아\n시우</textarea>
        <div class="participant-meta"><span>한 줄에 한 명씩 입력</span><b id="nameCount">10명</b></div>
        <div class="settings-row">
          <div class="control winner-control"><span>당첨 인원</span><div class="winner-stepper"><button id="winnerMinus" type="button">−</button><input id="winnerCount" type="number" min="1" value="1" inputmode="numeric" aria-label="당첨 인원"><button id="winnerPlus" type="button">+</button></div><div class="winner-presets"><button type="button" data-win="1">1</button><button type="button" data-win="2">2</button><button type="button" data-win="3">3</button><button type="button" data-win="5">5</button><button type="button" data-win="10">10</button><button type="button" data-win="all">전체</button></div></div>
          <div class="control"><span>레이스 길이</span><select id="length"><option value="short">짧게</option><option value="normal" selected>보통</option><option value="long">길게</option></select></div>
        </div>
        <button class="start-btn" id="startBtn">레이스 START ✦</button>
      </div>
      <div class="setup-right">
        <div class="section-title">코스 선택</div>
        <div class="section-desc">색만 다른 스킨이 아니라 장애물과 레이스 성격이 실제로 다릅니다.</div>
        <div class="maps">
          <button class="map-card selected" data-map="candy"><div class="map-art art-candy"></div><span class="tag">BOUNCE</span><div class="map-copy"><b>🍬 솜사탕 정원</b><small>팝 범퍼 · 통통 튀는 랜덤 코스</small></div></button>
          <button class="map-card" data-map="neon"><div class="map-art art-neon"></div><span class="tag">SPEED</span><div class="map-copy"><b>⚡ 네온 아케이드</b><small>회전바 · 부스터 · 빠른 역전</small></div></button>
          <button class="map-card" data-map="space"><div class="map-art art-space"></div><span class="tag">GRAVITY</span><div class="map-copy"><b>🪐 우주 정거장</b><small>중력장 · 저중력 구간 · 궤도 범퍼</small></div></button>
          <button class="map-card" data-map="jungle"><div class="map-art art-jungle"></div><span class="tag">TRAP</span><div class="map-copy"><b>🗿 정글 유적</b><small>병목 · 흔들문 · 진흙 감속</small></div></button>
          <button class="map-card" data-map="chaos"><div class="map-art art-chaos"></div><span class="tag">INSANE</span><div class="map-copy"><b>🎪 카오스 머신</b><small>회전체 · 범퍼 · 부스터 총집합</small></div></button>
        </div>
      </div>
    </div>
  </div>

  <div id="hud">
    <div class="topbar">
      <div class="race-title glass"><b id="courseTitle">솜사탕 정원</b><span id="raceStatus">READY</span></div>
      <div class="rank-strip" id="rankStrip"></div>
      <div class="hud-btns"><button class="icon-btn" id="audioBtn" title="소리">🔊</button><button class="icon-btn" id="pauseBtn" title="일시정지">⏸</button><button class="icon-btn" id="fullBtn" title="전체화면">⛶</button></div>
    </div>
    <div class="side-card glass"><h3>LIVE RANK</h3><div id="leaderList"></div><canvas id="minimap" width="280" height="420"></canvas></div>
    <div class="bottom-actions"><button class="pill hot" id="shakeBtn">⚡ 보드 흔들기</button><button class="pill" id="restartBtn">↻ 다시 시작</button></div>
  </div>
  <div id="cameraBadge">AUTO CAM</div>
  <div id="countdown"><div id="countdownText">3</div></div>
  <div id="eventBanner">PHOTO FINISH!</div>
  <div id="results"><div class="result-card glass"><h2 class="result-title">🏁 RACE RESULT</h2><div class="result-sub" id="resultSub"></div><div class="podium" id="podium"></div><div class="extra-winners" id="extraWinners"></div><div class="result-actions"><button class="primary" id="againBtn">같은 설정으로 다시</button><button id="setupBtn">설정으로</button></div></div></div>
</div>
<script>
(()=>{
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),mini=document.querySelector('#minimap'),mctx=mini.getContext('2d');
const UI={setup:document.querySelector('#setup'),hud:document.querySelector('#hud'),names:document.querySelector('#names'),nameCount:document.querySelector('#nameCount'),winnerCount:document.querySelector('#winnerCount'),winnerMinus:document.querySelector('#winnerMinus'),winnerPlus:document.querySelector('#winnerPlus'),length:document.querySelector('#length'),startBtn:document.querySelector('#startBtn'),rankStrip:document.querySelector('#rankStrip'),leaderList:document.querySelector('#leaderList'),courseTitle:document.querySelector('#courseTitle'),raceStatus:document.querySelector('#raceStatus'),countdown:document.querySelector('#countdown'),countdownText:document.querySelector('#countdownText'),eventBanner:document.querySelector('#eventBanner'),results:document.querySelector('#results'),podium:document.querySelector('#podium'),extraWinners:document.querySelector('#extraWinners'),resultSub:document.querySelector('#resultSub'),pauseBtn:document.querySelector('#pauseBtn'),audioBtn:document.querySelector('#audioBtn'),fullBtn:document.querySelector('#fullBtn'),shakeBtn:document.querySelector('#shakeBtn'),restartBtn:document.querySelector('#restartBtn'),againBtn:document.querySelector('#againBtn'),setupBtn:document.querySelector('#setupBtn'),cameraBadge:document.querySelector('#cameraBadge')};
let W=innerWidth,H=innerHeight,DPR=1;function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const palettes={candy:{title:'🍬 솜사탕 정원',bg1:'#27184f',bg2:'#10162e',track:'#452c68',rail:'#ff8fc3',peg:'#ffd874',glow:'#ff71b6',accent:'#87ffe4'},neon:{title:'⚡ 네온 아케이드',bg1:'#050613',bg2:'#10163e',track:'#121b42',rail:'#2ee8ff',peg:'#ff47b5',glow:'#2ee8ff',accent:'#ff4fbf'},space:{title:'🪐 우주 정거장',bg1:'#06081d',bg2:'#170b37',track:'#141d42',rail:'#8f78ff',peg:'#e6e7ff',glow:'#a67cff',accent:'#6ff7ff'},jungle:{title:'🗿 정글 유적',bg1:'#07251f',bg2:'#182918',track:'#273c2d',rail:'#d2b85b',peg:'#8ed16f',glow:'#f0cf6a',accent:'#68e6a5'},chaos:{title:'🎪 카오스 머신',bg1:'#231126',bg2:'#10162a',track:'#29213e',rail:'#ff6b8d',peg:'#ffe06f',glow:'#a77bff',accent:'#54f3d4'}};
let selectedMap='candy',winnerCount=1,lengthMode='normal',running=false,paused=false,finished=false,audioOn=true,shake=0,raceTime=0,last=performance.now(),lastLeader=null,photoShown=false,slowmo=false,finishTimer=0,cameraY=0,cameraTargetY=0,cameraZoom=1,cameraZoomTarget=1,cameraKick=0,cameraFocus=null,cameraFocusUntil=0,finishY=3500,trackWidth=920,marbles=[],obstacles=[],zones=[],particles=[],screenParticles=[],winners=[],startNames=[],rescuePulse=0;
const colors=['#ff5f83','#58e8cf','#ffd05f','#74a5ff','#c47cff','#ff945b','#76e06a','#54d8ff','#f56bdf','#eeeeff','#ffcfec','#7ae0ff','#ffc176','#98f39c','#b18cff','#ff7474','#65f4cf','#d5e35e','#6ca8ff','#fd8ac7','#f4a261','#a8dadc','#e9c46a','#9b5de5','#00f5d4','#f15bb5','#fee440','#00bbf9','#ff9f1c','#2ec4b6'];
function parsedNames(){return UI.names.value.split(/\n|,/).map(s=>s.trim()).filter(Boolean).slice(0,60)}
function participantCount(){return Math.max(1,parsedNames().length)}
function setWinnerCount(v){const max=participantCount();winnerCount=clamp(Math.round(Number(v)||1),1,max);UI.winnerCount.value=winnerCount;document.querySelectorAll('.winner-presets button').forEach(b=>{const val=b.dataset.win==='all'?max:Number(b.dataset.win);b.disabled=b.dataset.win!=='all'&&Number(b.dataset.win)>max;b.classList.toggle('active',val===winnerCount)})}

UI.startBtn.onclick=startRace;UI.pauseBtn.onclick=()=>{paused=!paused;UI.pauseBtn.textContent=paused?'▶':'⏸'};UI.fullBtn.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();UI.shakeBtn.onclick=()=>{shake=1.1;for(const m of marbles.filter(x=>!x.done)){m.vx+=rnd(-520,520);m.vy+=rnd(-120,100)}cameraKick=1;showBanner('SHAKE!',500);noise(.16,.08);tone(90,.15,'sawtooth',.08)};UI.restartBtn.onclick=()=>{stopMusic();initRace(startNames);document.body.dataset.final='';UI.results.style.display='none';running=true;doCountdown()};UI.againBtn.onclick=()=>{UI.results.style.display='none';initRace(startNames);document.body.dataset.final='';running=true;doCountdown()};UI.setupBtn.onclick=()=>{stopMusic();running=false;finished=false;UI.results.style.display='none';UI.hud.style.display='none';UI.cameraBadge.style.display='none';UI.setup.style.display='grid'};
function draw(){const p=palettes[selectedMap],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,p.bg1);g.addColorStop(1,p.bg2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const now=performance.now()/1000;ctx.save();ctx.globalAlpha=.22;for(let i=0;i<22;i++){const x=(i*197.13+Math.sin(now*.3+i)*90)%W,y=(i*113.7+now*(8+i%3))%(H+80)-40;ctx.fillStyle=i%3?p.accent:p.glow;ctx.beginPath();ctx.arc(x,y,1+(i%4)*.6,0,TAU);ctx.fill()}ctx.restore();if(!marbles.length)return;shake=Math.max(0,shake-.025);if(rescuePulse>0){ctx.fillStyle=`rgba(255,255,255,${rescuePulse*.08})`;ctx.fillRect(0,0,W,H)}if(running){const rank=ranking(),leader=(cameraFocus&&performance.now()<cameraFocusUntil)?cameraFocus:(rank.find(m=>!m.done)||rank[0]);if(leader){const overallPlace=leader.done?leader.rank:(winners.length+1);UI.cameraBadge.style.display=running?'block':'none';UI.cameraBadge.textContent=(cameraFocus&&performance.now()<cameraFocusUntil)?`WINNER CAM · 1위 ${leader.name}`:`AUTO CAM · ${overallPlace}위 ${leader.name}`}}
 const amp=(8+cameraKick*10)*shake+(cameraKick*2.5),shx=(shake||cameraKick)?rnd(-amp,amp):0,shy=(shake||cameraKick)?rnd(-amp*.72,amp*.72):0;ctx.save();ctx.translate(shx,shy);drawTrack(p);drawZones(p);drawObstacles(p);drawFinish(p);drawMarbles();drawParticles();ctx.restore();drawScreenParticles();drawVignette(p);drawMinimap(p);if(running)updateHud();}
function drawTrack(p){const a=worldToScreen(72,cameraY),b=worldToScreen(trackWidth-72,cameraY),scale=a.scale;const tg=ctx.createLinearGradient(a.x,0,b.x,H);tg.addColorStop(0,shade(p.track,8));tg.addColorStop(.5,p.track);tg.addColorStop(1,shade(p.track,-10));ctx.fillStyle=tg;ctx.globalAlpha=.97;ctx.fillRect(a.x,0,b.x-a.x,H);ctx.globalAlpha=1;ctx.save();ctx.strokeStyle='rgba(255,255,255,.055)';ctx.lineWidth=2;const slide=(raceTime*180)%92;for(let y=-92+slide;y<H+92;y+=92){ctx.beginPath();ctx.moveTo(a.x,y);ctx.lineTo(b.x,y);ctx.stroke()}ctx.globalCompositeOperation='screen';ctx.shadowBlur=22;ctx.shadowColor=p.rail;ctx.strokeStyle=p.rail;ctx.globalAlpha=.62;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(a.x+2,0);ctx.lineTo(a.x+2,H);ctx.moveTo(b.x-2,0);ctx.lineTo(b.x-2,H);ctx.stroke();for(let y=-20+((raceTime*260)%74);y<H+40;y+=74){ctx.fillStyle=p.accent;ctx.globalAlpha=.72;ctx.fillRect(a.x-4,y,7,18);ctx.fillRect(b.x-3,y,7,18)}ctx.restore()}
function drawZones(p){for(const z of zones){const c=worldToScreen(z.x,z.y),s=c.scale;const x=c.x-z.w*s/2,y=c.y-z.h*s/2,w=z.w*s,h=z.h*s;if(y>H+120||y+h<-120)continue;const col=z.kind==='boost'?'#5cf2df':z.kind==='mud'?'#b49a4d':z.kind==='lowgrav'?'#8799ff':'#b574ff';ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.16+.05*Math.sin(raceTime*5);ctx.fillStyle=col;ctx.shadowBlur=28;ctx.shadowColor=col;ctx.fillRect(x,y,w,h);ctx.globalAlpha=.72;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([12,8]);ctx.lineDashOffset=-(raceTime*75)%20;ctx.strokeRect(x,y,w,h);ctx.setLineDash([]);if(z.kind==='boost'){ctx.globalAlpha=.44;ctx.lineWidth=4;for(let yy=y+14-(raceTime*140%(34*s));yy<y+h;yy+=34*s){for(let xx=x+20;xx<x+w-20;xx+=48*s){ctx.beginPath();ctx.moveTo(xx-9*s,yy+8*s);ctx.lineTo(xx,yy-4*s);ctx.lineTo(xx+9*s,yy+8*s);ctx.stroke()}}}ctx.globalCompositeOperation='source-over';ctx.font=`1000 ${Math.max(11,15*s)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.9)';ctx.shadowBlur=10;ctx.shadowColor='#000';ctx.fillText(z.kind==='boost'?'BOOST!':z.kind==='mud'?'SLOW':z.kind==='lowgrav'?'LOW-G':'GRAVITY',c.x,c.y+4);ctx.restore()}}
function drawObstacles(p){for(const o of obstacles){if(o.kind==='circle'){const c=worldToScreen(o.x,o.y),r=o.r*c.scale;if(c.y+r<-60||c.y-r>H+60)continue;ctx.save();ctx.globalCompositeOperation='screen';ctx.shadowBlur=o.pulse?30:16;ctx.shadowColor=o.color||p.glow;ctx.fillStyle=o.color||p.peg;ctx.beginPath();ctx.arc(c.x,c.y,r,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=Math.max(1.5,2.2*c.scale);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.arc(c.x-r*.27,c.y-r*.3,r*.25,0,TAU);ctx.fill();if(o.pulse){ctx.strokeStyle=o.color||p.glow;ctx.globalAlpha=.35+.25*Math.sin(raceTime*7+o.x);ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,r*(1.45+.12*Math.sin(raceTime*5)),0,TAU);ctx.stroke()}ctx.restore()}else{let x1,y1,x2,y2,th=o.thick,col=o.color||p.rail;if(o.kind==='spinner'){const e=spinnerEnds(o);[x1,y1,x2,y2]=e}else{x1=o.x1;y1=o.y1;x2=o.x2;y2=o.y2}const a=worldToScreen(x1,y1),b=worldToScreen(x2,y2);if((a.y<-120&&b.y<-120)||(a.y>H+120&&b.y>H+120))continue;ctx.save();ctx.lineCap='round';ctx.lineWidth=(th+5)*a.scale;ctx.strokeStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.moveTo(a.x+3,a.y+4);ctx.lineTo(b.x+3,b.y+4);ctx.stroke();ctx.globalCompositeOperation='screen';ctx.lineWidth=th*a.scale;ctx.strokeStyle=col;ctx.shadowBlur=o.kind==='spinner'?26:14;ctx.shadowColor=col;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(1.2,2.2*a.scale);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(o.kind==='spinner'){const c=worldToScreen(o.cx,o.cy);ctx.fillStyle='#fff';ctx.shadowBlur=18;ctx.shadowColor=col;ctx.beginPath();ctx.arc(c.x,c.y,11*a.scale,0,TAU);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,17*a.scale,0,TAU);ctx.stroke()}ctx.restore()}}}
function drawFinish(p){const L=worldToScreen(88,finishY),R=worldToScreen(trackWidth-88,finishY),s=L.scale;if(L.y<-80||L.y>H+80)return;const cell=28*s;for(let x=L.x,i=0;x<R.x;x+=cell,i++){ctx.fillStyle=i%2?'#fff':'#171722';ctx.fillRect(x,L.y-9*s,Math.min(cell,R.x-x),18*s)}ctx.fillStyle='#fff';ctx.font=`1000 ${28*s}px system-ui`;ctx.textAlign='center';ctx.fillText('FINISH',W/2,L.y-22*s)}
function drawMarbles(){const rank=ranking(),now=performance.now(),leader=(cameraFocus&&now<cameraFocusUntil)?cameraFocus:(rank.find(m=>!m.done)||rank[0]);for(const m of rank.slice().reverse()){const c=worldToScreen(m.x,m.y),r=m.r*c.scale;if(c.y+r<-80||c.y-r>H+80)continue;ctx.save();for(let i=1;i<m.trail.length;i++){const t=m.trail[i],pp=worldToScreen(t[0],t[1]),alpha=(i/m.trail.length)*(.1+Math.min(.22,Math.abs(m.vy)/4200));ctx.globalAlpha=alpha;ctx.fillStyle=m.color;ctx.shadowBlur=14;ctx.shadowColor=m.color;ctx.beginPath();ctx.arc(pp.x,pp.y,r*(.3+i/m.trail.length*.32),0,TAU);ctx.fill()}ctx.globalAlpha=1;if(m===leader){const winnerLocked=m.done&&cameraFocus===m&&now<cameraFocusUntil;ctx.globalCompositeOperation='screen';ctx.strokeStyle=winnerLocked?'#ffffff':'#ffe86f';ctx.lineWidth=winnerLocked?4:3;ctx.shadowBlur=winnerLocked?34:24;ctx.shadowColor=winnerLocked?m.color:'#ffe86f';ctx.globalAlpha=.72+.2*Math.sin(raceTime*8);ctx.beginPath();ctx.arc(c.x,c.y,r*(winnerLocked?1.62:1.42),0,TAU);ctx.stroke();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.font=`900 ${Math.max(13,15*c.scale)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillStyle=winnerLocked?'#fff':'#ffe86f';const overallPlace=m.done?m.rank:(winners.length+1);ctx.fillText(winnerLocked?'★ WINNER':`▲ ${overallPlace}위`,c.x,c.y-r*(winnerLocked?1.72:1.55))}ctx.shadowBlur=24;ctx.shadowColor=m.color;const g=ctx.createRadialGradient(c.x-r*.38,c.y-r*.43,r*.06,c.x,c.y,r);g.addColorStop(0,'#fff');g.addColorStop(.12,'#fff');g.addColorStop(.27,m.color);g.addColorStop(1,shade(m.color,-42));ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,r,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.2;ctx.stroke();ctx.shadowBlur=8;ctx.font=`1000 ${Math.max(11,13*c.scale)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='bottom';const tw=ctx.measureText(m.name).width;ctx.fillStyle='rgba(5,7,15,.72)';roundRect(ctx,c.x-tw/2-7,c.y-r-23,tw+14,19,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(m.name,c.x,c.y-r-7);ctx.restore()}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function roundRect(c,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+rr,y);c.arcTo(x+w,y,x+w,y+h,rr);c.arcTo(x+w,y+h,x,y+h,rr);c.arcTo(x,y+h,x,y,rr);c.arcTo(x,y,x+w,y,rr);c.closePath()}
function drawScreenParticles(){for(const p of screenParticles){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.color;ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();ctx.restore()}}
function drawVignette(p){const g=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.22,W/2,H*.45,Math.max(W,H)*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.65,'rgba(0,0,0,.03)');g.addColorStop(1,'rgba(0,0,0,.48)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(slowmo){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.13+.05*Math.sin(raceTime*10);ctx.strokeStyle=p.accent;ctx.lineWidth=10;ctx.strokeRect(5,5,W-10,H-10);ctx.restore()}}
function drawParticles(){for(const p of particles){const c=worldToScreen(p.x,p.y);ctx.save();ctx.translate(c.x,c.y);ctx.rotate(p.rot);ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.65);ctx.restore()}}
function drawMinimap(p){const w=mini.width,h=mini.height;mctx.clearRect(0,0,w,h);mctx.fillStyle='rgba(6,8,18,.9)';mctx.fillRect(0,0,w,h);mctx.strokeStyle=p.rail;mctx.globalAlpha=.55;mctx.lineWidth=3;mctx.strokeRect(28,8,w-56,h-16);mctx.globalAlpha=1;for(const m of marbles){const x=28+(w-56)*(m.x/trackWidth),y=8+(h-16)*clamp(m.y/finishY,0,1);mctx.fillStyle=m.color;mctx.beginPath();mctx.arc(x,y,m.done?3.7:3,0,TAU);mctx.fill()}const scale=Math.min(1.1,(W-120)/trackWidth),viewWorld=H/scale;const y=8+(h-16)*clamp(cameraY/finishY,0,1),hh=(h-16)*Math.min(1,viewWorld/finishY);mctx.strokeStyle='white';mctx.globalAlpha=.65;mctx.lineWidth=1.5;mctx.strokeRect(24,y,w-48,hh);mctx.globalAlpha=1}

window.__MARBLE_DEBUG=()=>{const rank=ranking(),leader=(cameraFocus&&performance.now()<cameraFocusUntil)?cameraFocus:rank.find(m=>!m.done)||rank[0],ls=leader?worldToScreen(leader.x,leader.y):null;return {running,paused,finished,raceTime,finishY,cameraY,cameraZoom,audioOn,audioState:audioCtx?.state||'none',musicActive:!!musicTimer,cameraMode:(cameraFocus&&performance.now()<cameraFocusUntil)?'winner':'leader',leader:leader?.name||null,leaderScreenY:ls?.y??null,winners:winners.map(x=>x.name),marbles:marbles.map(m=>({name:m.name,x:m.x,y:m.y,vx:m.vx,vy:m.vy,done:m.done,stuckT:m.stuckT,rescueCount:m.rescueCount}))}};
